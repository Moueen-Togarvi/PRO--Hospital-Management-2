<div id="success-modal"
  class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-[110]">
  <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4 text-center transform transition-all">
    <div id="success-icon" class="mb-4">
      <i class="fas fa-check-circle text-6xl text-green-500"></i>
    </div>
    <p id="success-message" class="text-xl font-semibold text-gray-800 mb-6">
      Operation completed successfully.
    </p>
    <button id="success-ok-btn"
      class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition">
      OK
    </button>
  </div>
</div>

<div id="confirm-modal"
  class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-[120]">
  <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md mx-4 text-center transform transition-all">
    <div class="mb-4">
      <i class="fas fa-question-circle text-6xl text-blue-500"></i>
    </div>
    <p id="confirm-message" class="text-xl font-semibold text-gray-800 mb-6">Are you sure?</p>
    <div class="flex gap-3 justify-center">
      <button id="confirm-cancel-btn"
        class="bg-gray-500 text-white px-6 py-2 rounded-lg font-semibold hover:bg-gray-600 transition">
        Cancel
      </button>
      <button id="confirm-ok-btn"
        class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Confirm
      </button>
    </div>
  </div>
</div>
