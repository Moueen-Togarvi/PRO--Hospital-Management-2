{% extends "base.html" %}

{% block content %}
<section id="canteen-view" class="view-section -mx-4 -my-5 bg-[#f6fbf8] p-4 md:-mx-8 md:-my-8 md:p-8">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-green-900">
        <i class="fas fa-utensils mr-2"></i>Canteen Management
      </h2>
      <p class="mt-1 text-sm text-gray-500">Daily spending tracker with monthly totals</p>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-sm font-medium text-gray-700">Month:</label>
      <select id="canteen-month-select" class="rounded border px-3 py-2 text-sm">
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
      <select id="canteen-year-select" class="rounded border px-3 py-2 text-sm"></select>
      <button onclick="loadCanteenMonthlyTable()" class="rounded bg-green-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-green-700">
        Load
      </button>
    </div>
  </div>

  <div class="overflow-x-auto rounded bg-white shadow">
    <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 px-6 py-3 text-white">
      <h3 class="text-lg font-semibold">Monthly Canteen Tracker</h3>
      <p class="text-xs opacity-90" id="canteen-month-display">Loading...</p>
    </div>
    <div class="table-scroll-shell overflow-x-auto" style="max-height: 600px; --table-scroll-max-height: 600px;">
      <table id="canteen-monthly-table" class="min-w-full divide-y divide-gray-200">
        <thead class="sticky top-0 bg-emerald-50">
          <tr id="canteen-table-header"></tr>
        </thead>
        <tbody id="canteen-monthly-body" class="divide-y divide-gray-100"></tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
  <script src="{{ url_for('static', filename='js/pages/canteen.js') }}"></script>
{% endblock %}
