{% extends "base.html" %}

{% block content %}
<section id="reports-view" class="view-section -mx-4 -my-5 bg-[#f6fbf8] p-4 md:-mx-8 md:-my-8 md:p-8">
  <div class="rounded-[28px] border border-emerald-100 bg-white/80 p-6 shadow-sm shadow-emerald-100/50 backdrop-blur">
    <div class="mb-8 flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
      <div>
        <h3 class="flex items-center gap-3 text-2xl font-black tracking-tight text-emerald-900">
          <div class="rounded-lg bg-emerald-600 p-2 text-white shadow-lg shadow-emerald-200">
            <i class="fas fa-clipboard-check"></i>
          </div>
          Shift Handover Reports
        </h3>
        <p class="mt-1 text-sm font-medium text-gray-500">Daily clinical and operational logs</p>
      </div>

      <div class="flex flex-wrap items-center gap-3 rounded-2xl border border-emerald-100 bg-white p-2 shadow-sm">
        <div class="flex items-center gap-2 border-r border-gray-100 px-3">
          <i class="fas fa-calendar-alt text-emerald-600"></i>
          <input
            type="date"
            id="report-date-picker"
            onchange="loadDailyReport()"
            class="cursor-pointer border-none bg-transparent p-1 text-sm font-black text-emerald-900 focus:ring-0"
          />
        </div>

        <div class="flex items-center gap-2">
          <button onclick="printReport('day')" class="flex items-center gap-2 rounded-xl px-3 py-2 text-xs font-black text-amber-600 transition-all hover:bg-amber-50">
            <i class="fas fa-sun text-sm"></i> Day
          </button>
          <button onclick="printReport('night')" class="flex items-center gap-2 rounded-xl px-3 py-2 text-xs font-black text-indigo-600 transition-all hover:bg-indigo-50">
            <i class="fas fa-moon text-sm"></i> Night
          </button>
          <button onclick="printReport('both')" class="flex items-center gap-2 rounded-xl bg-emerald-600 px-4 py-2 text-xs font-black text-white shadow-lg shadow-emerald-100 transition hover:bg-emerald-700">
            <i class="fas fa-print"></i> Print Full
          </button>
        </div>

        <button
          id="btn-save-layout"
          onclick="saveLayoutConfig()"
          class="hidden rounded-xl bg-gray-900 p-2 text-white shadow-lg transition hover:bg-black"
          title="Save Table Layout"
        >
          <i class="fas fa-save"></i>
        </button>
      </div>
    </div>

    <div id="day-report-container" class="mb-8">
      <div class="mb-2 flex items-center justify-between px-2">
        <h4 class="text-lg font-bold text-emerald-800">
          <i class="fas fa-sun mr-2 text-yellow-500"></i>Day Report
        </h4>
      </div>
      <div class="overflow-hidden rounded-xl border border-emerald-100 bg-white shadow-lg">
        <div class="table-scroll-shell w-full overflow-x-auto" style="--table-scroll-max-height: 26rem;">
          <table class="relative w-full divide-y divide-emerald-100" style="table-layout: fixed;">
            <thead class="bg-emerald-600 text-white">
              <tr id="day-header-row"></tr>
            </thead>
            <tbody id="day-table-body" class="divide-y divide-emerald-50 bg-white text-xs"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="night-report-container">
      <div class="mb-2 flex items-center justify-between px-2">
        <h4 class="text-lg font-bold text-indigo-900">
          <i class="fas fa-moon mr-2 text-indigo-500"></i>Night Report
        </h4>
      </div>
      <div class="overflow-hidden rounded-xl border border-indigo-100 bg-white shadow-lg">
        <div class="table-scroll-shell w-full overflow-x-auto" style="--table-scroll-max-height: 26rem;">
          <table class="relative w-full divide-y divide-indigo-100" style="table-layout: fixed;">
            <thead class="bg-emerald-600 text-white">
              <tr id="night-header-row"></tr>
            </thead>
            <tbody id="night-table-body" class="divide-y divide-indigo-50 bg-white text-xs"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="mt-6 flex flex-wrap justify-end gap-4 text-xs font-semibold text-gray-600">
      <div class="flex items-center gap-1.5">
        <div class="h-3 w-3 rounded border border-green-500 bg-green-100"></div>
        Done
      </div>
      <div class="flex items-center gap-1.5">
        <div class="h-3 w-3 rounded border border-red-500 bg-red-100"></div>
        Not Done
      </div>
      <div class="flex items-center gap-1.5">
        <div class="h-3 w-3 rounded border border-yellow-500 bg-yellow-100"></div>
        Emergency/Complain
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
  <script src="{{ url_for('static', filename='js/pages/reports.js') }}"></script>
{% endblock %}
