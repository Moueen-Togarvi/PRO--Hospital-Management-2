{% extends "base.html" %}

{% block content %}
<section id="team-view" class="view-section -mx-4 -my-5 bg-[#f6fbf8] p-4 md:-mx-8 md:-my-8 md:p-8">
  <div class="mb-6 flex flex-col justify-between gap-4 md:flex-row">
    <div>
      <h2 class="text-2xl font-bold text-green-900">
        <i class="fas fa-users-cog mr-2"></i>Our Team
      </h2>
      <p class="text-sm text-gray-500">Manage staff details, designations, and timings.</p>
    </div>
    <div>
      <button onclick="openEmployeeModal()" class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold text-white shadow-md transition hover:bg-emerald-700">
        <i class="fas fa-plus mr-2"></i> Add Employee
      </button>
    </div>
  </div>

  <div class="kpi-card overflow-hidden" style="padding: 0; border-color: rgba(16, 185, 129, 0.2)">
    <div class="table-scroll-shell overflow-x-auto" style="--table-scroll-max-height: 24rem;">
      <table class="min-w-full divide-y divide-emerald-100">
        <thead class="bg-gradient-to-r from-emerald-700 to-emerald-600 text-white">
          <tr>
            <th class="whitespace-nowrap px-4 py-3 text-center text-xs font-semibold uppercase">S.No</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Name</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Designation</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Pay</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Advance</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Duty Timings</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Joining Date</th>
            <th class="whitespace-nowrap px-4 py-3 text-left text-xs font-semibold uppercase">Contact Info</th>
            <th class="whitespace-nowrap px-4 py-3 text-center text-xs font-semibold uppercase">Actions</th>
          </tr>
        </thead>
        <tbody id="team-table-body" class="divide-y divide-emerald-50 bg-white"></tbody>
      </table>
    </div>
  </div>
</section>

<div id="employee-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900 bg-opacity-50">
  <div class="mx-4 max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-xl bg-white p-6 shadow-2xl">
    <div class="mb-6 flex items-center justify-between">
      <h3 class="text-2xl font-bold text-green-900" id="emp-modal-title">
        <i class="fas fa-user-tie mr-2"></i>Add Employee
      </h3>
      <button onclick="closeEmployeeModal()" class="text-2xl text-gray-400 hover:text-gray-600">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form id="employee-form" onsubmit="saveEmployee(event)">
      <input type="hidden" id="emp-id" />
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Name *</label>
          <input type="text" id="emp-name" class="w-full rounded border p-2" placeholder="Full Name" required />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Designation *</label>
          <input type="text" id="emp-designation" class="w-full rounded border p-2" placeholder="e.g. CEO, Medical Officer, Cook" required />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Pay</label>
          <input type="text" id="emp-pay" class="w-full rounded border p-2" placeholder="Salary Amount" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Advance</label>
          <input type="text" id="emp-advance" class="w-full rounded border p-2" placeholder="Advance Taken" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Duty Timings</label>
          <input type="text" id="emp-timings" class="w-full rounded border p-2" placeholder="e.g. 9am to 5pm" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Date of Joining</label>
          <input type="text" id="emp-joining" class="w-full rounded border p-2" placeholder="e.g. September 4, 2024" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">CNIC #</label>
          <input type="text" id="emp-cnic" class="w-full rounded border p-2" placeholder="XXXXX-XXXXXXX-X" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-semibold text-gray-700">Phone #</label>
          <input type="text" id="emp-phone" class="w-full rounded border p-2" placeholder="03XX-XXXXXXX" />
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button type="submit" class="flex-1 rounded-lg bg-green-600 py-3 font-semibold text-white transition hover:bg-green-700">
          <i class="fas fa-save mr-2"></i>Save Details
        </button>
        <button type="button" onclick="closeEmployeeModal()" class="flex-1 rounded-lg bg-gray-200 py-3 font-semibold text-gray-700 transition hover:bg-gray-300">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/pages/team.js') }}"></script>
{% endblock %}
